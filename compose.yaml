name: Minerva-Dev
services:
  core:
    build:
      context: ./core
    image: minerva-core:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_AI_OPENAI_BASE_URL: http://ollama:11434/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      TERMINAL_INPUT: False
    volumes:
      - core-tmp:/tmp
    networks:
      - minerva-network
    depends_on:
      db:
        condition: service_healthy
      voice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  ollama:
    image: ollama/ollama:latest
    ports:
      - 11434:11434
    volumes:
      - ./ollama/ollama:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    entrypoint: ["/usr/bin/bash", "/entrypoint.sh"]
    networks:
      - minerva-network

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - minerva-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  voice:
    build:
      context: ./SimpleVoice
    image: minerva-voice:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - voice-tmp:/app/tmp
      - voice-cache:/home/app/.cache
    networks:
      - minerva-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 300s

volumes:
  core-tmp:
  db-data:
  voice-cache:
  voice-tmp:

secrets:
  db-password:
    file: ./db/password.txt

networks:
  minerva-network:
