services:
  core:
    build: core
    ports:
      - 8080:8080
    environment:
      - POSTGRES_DB=postgres
    networks:
      - minerva-network
  db:
    image: postgres
    restart: always
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - minerva-network
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    expose:
      - 5432
  voice:
    build: voice
    ports:
      - 8000:8000
    networks:
      - minerva-network
volumes:
  db-data:
secrets:
  db-password:
    file: db/password.txt
networks:
  minerva-network: