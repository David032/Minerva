name: Maven Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "0 20 * * 1-5"

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-26.04-arm, windows-11-arm, macOS-latest ]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file
        cache: maven

    - name: Build project
      run: ./mvnw -B -DskipTests package

    - name: Run Continuous-tagged tests
      run: ./mvnw -B -Dgroups=ContinuousIntegration test

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

    - name: Upload Test Results
      if: (!cancelled())
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: JUnit test results (${{ matrix.os }})
        path: ./core/build/test-results/test

  publish-test-results:
    name: "Publish Tests Results"
    needs: build-and-test
    runs-on: ubuntu-slim
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    if: (!cancelled())

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: "JUnit Test Results"
          comment_mode: create new
          files: "artifacts/**/*.xml"