name: Maven Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "0 20 * * 1-5"

defaults:
  run:
    shell: bash
    working-directory: ./core

jobs:
  build-and-test:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file
        cache: maven

    - name: Make maven wrapper executable
      run: chmod +x ./mvnw

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Build project
      run: ./mvnw -B -DskipTests package

    - name: Run Continuous-tagged tests
      run: ./mvnw -B -Dgroups=ContinuousIntegration test

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

    - name: Upload Surefire XML reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: continuous-test-report
        path: core/target/surefire-reports/*.xml
        if-no-files-found: warn

    - name: Publish test report to PR
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: core/target/surefire-reports/*.xml
        check_name: CI/CD Results
        comment_mode: always