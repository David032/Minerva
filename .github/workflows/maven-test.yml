name: Maven Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - dev

defaults:
  run:
    shell: bash
    working-directory: ./core

jobs:
  build-and-test:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
      issues: read
      checks: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 26
      uses: actions/setup-java@v6
      with:
        java-version: '26'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file
        cache: maven

    - name: Build project
      run: mvn -B -DskipTests package

    - name: Run unit tests
      run: mvn -B -Dgroups=Unit test

    - name: Test project
      run: mvn -B -Dgroups=ContinuousIntegration test

    - name: Upload Surefire XML reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: continuous-test-report
        path: core/target/surefire-reports/*.xml
        if-no-files-found: warn

    - name: Publish test report to PR
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: core/target/surefire-reports/*.xml
        check_name: CI/CD Results
        comment_mode: always