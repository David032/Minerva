spring.application.name=Minerva
server.port=8080
server.address=0.0.0.0
spring.servlet.multipart.max-file-size=10MB
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:http://litert:9379/v1}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:unused}
spring.ai.openai.chat.model=${SPRING_AI_OPENAI_CHAT_MODEL:gemma4-e2b}
spring.ai.session.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.platform=postgresql
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/postgres}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driverClassName=org.postgresql.Driver
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
