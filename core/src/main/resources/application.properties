spring.application.name=Minerva
server.port=8080
server.address=0.0.0.0
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=4GB
spring.servlet.multipart.resolve-lazily=true
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:unused}
spring.ai.openai.chat.model=${SPRING_AI_OPENAI_CHAT_MODEL:gemma4:e2b}
spring.ai.openai.chat.extra-body.num-ctx=32768
spring.ai.session.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.platform=postgresql
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:ThingExplainer}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driverClassName=org.postgresql.Driver
minerva.reminders.time-zone=${MINERVA_TIME_ZONE:UTC}
minerva.reminders.poll-interval=${MINERVA_REMINDERS_POLL_INTERVAL:1000}
minerva.heartbeat.enabled=${MINERVA_HEARTBEAT_ENABLED:true}
minerva.heartbeat.cron=${MINERVA_HEARTBEAT_CRON:0 0 * * * *}
minerva.heartbeat.zone=${MINERVA_HEARTBEAT_ZONE:UTC}
minerva.tool-search.enabled=${MINERVA_TOOL_SEARCH_ENABLED:false}
minerva.journiv.url=${JOURNIV_URL:}
minerva.journiv.email=${JOURNIV_EMAIL:}
minerva.journiv.password=${JOURNIV_PASSWORD:}
minerva.journiv.zone=${JOURNIV_TIME_ZONE:${MINERVA_TIME_ZONE:UTC}}
minerva.journiv.retry-interval=${JOURNIV_RETRY_INTERVAL:60000}
spring.task.scheduling.pool.size=2
management.endpoints.web.exposure.include=*
management.endpoint.health.probes.enabled=true
spring.ai.ollama.base-url=${SPRING_AI_OPENAI_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.num-ctx=32768
spring.ai.ollama.chat.model=gemma4:e2b
ollama.required-model=gemma4:e2b
logging.file.path=${MINERVA_DATA_DIR:${user.home}/MinervaOS}/logs
IO_KEY= ${IO_KEY:iokey}
IO_USERNAME= ${IO_KEY:iopassword}
brave.api.key=${BRAVE_API_KEY}