spring.application.name=Minerva
server.port=8080
server.address=0.0.0.0
spring.servlet.multipart.max-file-size=10MB
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:unused}
spring.ai.openai.chat.model=${SPRING_AI_OPENAI_CHAT_MODEL:gemma4:e2b}
spring.ai.openai.chat.extra-body.num-ctx=16384
spring.ai.session.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.platform=postgresql
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:ThingExplainer}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driverClassName=org.postgresql.Driver
management.endpoints.web.exposure.include=*
management.endpoint.health.probes.enabled=true
spring.ai.ollama.base-url=${SPRING_AI_OPENAI_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.num-ctx=16384
spring.ai.ollama.chat.model=gemma4:e2b
ollama.required-model=gemma4:e2b
logging.file.path=/MinervaOSLogs