spring.application.name=Minerva
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.ai.openai.base-url=http://localhost:9379/v1
spring.ai.openai.api-key=null
spring.ai.openai.chat.model=gemma4-e2b
spring.ai.session.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.platform=mysql
spring.datasource.url = jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=ThingExplainer
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driverClassName=org.postgresql.Driver