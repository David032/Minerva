<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f2">
    <title>Minerva Chat</title>
    <link rel="stylesheet" th:href="@{/chat.css}">
    <script th:src="@{/chat.js}" defer></script>
</head>
<body>
<main class="chat">
    <header class="chat-header">
        <div class="brand-mark" aria-hidden="true">M</div>
        <div>
            <h1>Minerva</h1>
            <p>Your local assistant</p>
        </div>
        <a th:href="@{/personality}">Customize personality</a>
        <a th:href="@{/skills}">Import skills</a>
        <a th:href="@{/library}">Library</a>
    </header>

    <section id="reminders" class="reminders" aria-labelledby="reminders-heading">
        <div class="reminders-heading">
            <h2 id="reminders-heading">Reminders</h2>
            <div class="reminder-actions">
                <button id="refresh-reminders" type="button">Refresh</button>
                <button id="toggle-reminders" type="button" aria-expanded="true" aria-controls="reminder-content">Hide</button>
            </div>
        </div>
        <div id="reminder-content">
            <form id="reminder-form" class="reminder-form">
                <label>
                    <span>When</span>
                    <input id="reminder-time" name="time" type="datetime-local" required>
                </label>
                <label>
                    <span>Reminder</span>
                    <input id="reminder-message" name="message" maxlength="1000" required>
                </label>
                <button type="submit">Add reminder</button>
            </form>
            <p id="reminder-status" role="status" aria-live="assertive"></p>
            <ul id="reminder-list" aria-live="polite"></ul>
        </div>
    </section>

    <section id="conversation" class="conversation" aria-label="Conversation" aria-live="polite">
        <p class="welcome">What can I help you with?</p>
    </section>

    <form id="message-form" class="composer">
        <label class="visually-hidden" for="message-input">Message Minerva</label>
        <textarea id="message-input" name="message" rows="1" placeholder="Message Minerva..."></textarea>
        <input id="image-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
        <button id="attach-image-button" type="button" class="attach-button" aria-label="Attach an image">+</button>
        <button id="send-button" type="submit" aria-label="Send message">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 12 20 4l-5 16-3-7-8-1Zm8 1 4-5"></path>
            </svg>
        </button>
    </form>
    <div id="image-preview" class="image-preview" hidden>
        <img id="image-preview-image" alt="Selected image preview">
        <span id="image-preview-name"></span>
        <button id="remove-image-button" type="button" aria-label="Remove selected image">Remove</button>
    </div>
    <p id="status" class="status" role="status"></p>
</main>
</body>
</html>
